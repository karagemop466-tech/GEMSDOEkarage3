[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karage3"
version = "0.1.0"
description = "GEMSDOEkarage3 (K3 lane) - corrected-LiDAR scarp-pair + worm-persistence blind-fault discovery for the DOE GEMS Prize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.2", "rasterio>=1.3", "pandas>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
