name: Verify evidence site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify generated pages and tests
        run: |
          python scripts/build_site.py --check
          python scripts/build_review_status.py
          git diff --exit-code -- docs/index.html docs/executive-summary.html docs/current-gate-decision.json
          python -m pytest -q
          node --check assets/site.js
