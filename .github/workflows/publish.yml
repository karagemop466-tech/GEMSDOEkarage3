name: Publish evidence site
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    # The repository currently uses legacy Pages. An admin must enable
    # the Actions source and set this variable before artifact deployment.
    if: ${{ vars.ACTIONS_PAGES_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh public source metadata (fail closed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_feed.py
      - name: Rebuild static pages from pinned evidence
        run: python scripts/build_preflight_site.py
      - name: Build root evidence site
        run: python scripts/build_site.py --check
      - name: Stage public files
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp index.html executive-summary.html research.html sources.html "$RUNNER_TEMP/pages-site/"
          cp -r assets docs "$RUNNER_TEMP/pages-site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deploy
        uses: actions/deploy-pages@v4
