name: Test evidence and site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce pinned raster audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/audit_registry.py --fetch --cache "$RUNNER_TEMP/gems-inputs" --out "$RUNNER_TEMP/geometry.json"
          python scripts/check_reproduction.py evidence/geometry_audit.json "$RUNNER_TEMP/geometry.json"
          python scripts/audit_saved_tiffs.py --cache "$RUNNER_TEMP/gems-inputs" --verify-receipt evidence/saved-tiffs-literal-20261030.json
      - name: Verify preflight data and authoritative decision pages
        run: |
          python scripts/build_preflight_site.py
          python scripts/build_review_status.py
          python scripts/build_release_review.py
          git diff --exit-code -- docs/index.html docs/executive-summary.html docs/current-gate-decision.json
      - run: node --check docs/assets/site.js && node --test tests/test_browser_feed.js
