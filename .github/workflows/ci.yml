name: Test evidence and site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce pinned raster audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/audit_registry.py --fetch --cache "$RUNNER_TEMP/gems-inputs" --out "$RUNNER_TEMP/geometry.json"
          python scripts/check_reproduction.py evidence/geometry_audit.json "$RUNNER_TEMP/geometry.json"
      - run: python scripts/build_preflight_site.py && git diff --exit-code -- docs
      - run: node --check docs/assets/site.js && node --test tests/test_browser_feed.js
